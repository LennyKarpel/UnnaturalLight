<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnnaturalLight</title>
    <style>
      :root {
        --bg: #121418;
        --panel: #1b1f27;
        --ink: #e8e4dc;
        --muted: #9a9488;
        --accent: #e2a13a;
        --track: #2a303b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 1.25rem;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      }
      h1 { margin: 0; font-size: 20px; letter-spacing: 0.04em; }
      nav { display: grid; gap: 0.6rem; width: min(360px, 100%); }
      a {
        display: block;
        padding: 0.8rem 1rem;
        background: var(--panel);
        border: 1px solid var(--track);
        border-radius: 6px;
        color: var(--ink);
        text-decoration: none;
      }
      a:hover { border-color: var(--accent); }
      a b { display: block; color: var(--accent); }
      a span { color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>UnnaturalLight</h1>
    <nav>
      <a href="console/console.html"><b>Console</b><span>DMX faders, tunes, patch, instruments</span></a>
      <a href="stage/stage.html"><b>Stage</b><span>3D performance area, beams and walls</span></a>
    </nav>
  </body>
</html>
